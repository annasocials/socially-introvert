<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beyond Instagram · The Interactive Content Ecosystem Guide</title>
<meta name="description" content="A members-only interactive guide to connecting Instagram, Pinterest, your blog, email and website so your content works together. By Socially Introverts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Reenie+Beanie&display=swap">
<style>
:root{
  --bg:#FFF6F8;--surface:#FFFFFF;--surface-2:#FFEFF3;--line:#F2D5DC;--fg:#3B2A30;--muted:#7C646B;
  --accent:#C0243A;--accent-soft:#FFD9E1;--on-accent:#FFFFFF;--poster:#FFE4E9;--butter:#FFF6B8;--ink:#3B2A30;
  --pink:#F7BDB8;--sage-bg:#DCEAC8;--sage-fg:#2F4A14;--sun-bg:#FFF1B8;--sun-fg:#5C4A00;--peach-bg:#FFE0C2;--peach-fg:#6B3A0A;
  --lilac-bg:#E9E1EC;--lilac-fg:#46384D;--rose-bg:#FFD3DE;--rose-fg:#7A1630;--sage-strong:#6E9142;
  --font-display:"Reenie Beanie","Segoe Print","Bradley Hand",cursive;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --stk:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 5px rgba(59,42,48,.22));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1418;--surface:#291C21;--surface-2:#33232A;--line:#4A343C;--fg:#F8EBEE;--muted:#C3A9B0;--accent:#FF8497;--accent-soft:#4F2631;--on-accent:#2A0F16;
  --sage-bg:#2E4020;--sage-fg:#CFE7AE;--sun-bg:#4A3F12;--sun-fg:#FFE98A;--peach-bg:#55361A;--peach-fg:#FFD3A8;--lilac-bg:#3A3040;--lilac-fg:#DDD0E4;--rose-bg:#5A2434;--rose-fg:#FFC4D3;--sage-strong:#94BC66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1418;--surface:#291C21;--surface-2:#33232A;--line:#4A343C;--fg:#F8EBEE;--muted:#C3A9B0;--accent:#FF8497;--accent-soft:#4F2631;--on-accent:#2A0F16;--sage-bg:#2E4020;--sage-fg:#CFE7AE;--sun-bg:#4A3F12;--sun-fg:#FFE98A;--peach-bg:#55361A;--peach-fg:#FFD3A8;--lilac-bg:#3A3040;--lilac-fg:#DDD0E4;--rose-bg:#5A2434;--rose-fg:#FFC4D3;--sage-strong:#94BC66;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.display{font-family:var(--font-display);font-weight:400;line-height:.92}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px;white-space:nowrap}
.c-rose{background:var(--rose-bg);color:var(--rose-fg)}.c-sage{background:var(--sage-bg);color:var(--sage-fg)}.c-sun{background:var(--sun-bg);color:var(--sun-fg)}.c-peach{background:var(--peach-bg);color:var(--peach-fg)}.c-lilac{background:var(--lilac-bg);color:var(--lilac-fg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 20px;font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px;color:var(--fg);transition:transform .15s ease,background .15s ease}
.btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.small{padding:5px 12px;font-size:12px}

/* top bar + marquee */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.logo{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;text-decoration:none;color:var(--fg)}
.top nav{display:flex;gap:6px;align-items:center}
.top nav a{font-size:13px;font-weight:500;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:99px}
.top nav a:hover{background:var(--surface-2);color:var(--fg)}
.top nav a.cta{background:var(--accent);color:var(--on-accent)}
@media(max-width:520px){.top nav a.hide-s{display:none}.logo{font-size:10.5px;letter-spacing:.08em}.top nav a{padding:6px 10px;font-size:11px}.top .wrap{gap:6px}}
.marq{overflow:hidden;border-bottom:1px solid var(--line);background:var(--accent);color:var(--on-accent);white-space:nowrap}
.marq div{display:inline-block;padding:7px 0;font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;animation:marq 38s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:30px 48px;align-items:center;padding-top:40px}
.poster{container-type:inline-size;position:relative;width:100%;aspect-ratio:1080/1906;background:var(--poster);border-radius:26px;overflow:hidden;border:1px solid #F5CBD5;max-height:640px;justify-self:center}
.poster img{position:absolute;display:block;height:auto;max-width:none}
.poster .title{position:absolute;left:0;right:0;top:52.6%;transform:translateY(-50%);text-align:center;font-family:var(--font-display);font-size:16.2cqw;line-height:.92;color:var(--butter);-webkit-text-stroke:.55cqw var(--ink);paint-order:stroke fill;letter-spacing:.01em}
.poster .title span{display:block}
@media(max-width:860px){.hero{grid-template-columns:1fr}.poster{max-width:300px;max-height:none}}
.hero h1{font-size:clamp(30px,4.6vw,50px);line-height:1.06;font-weight:600;letter-spacing:-.015em;text-wrap:balance;margin:10px 0 16px}
.hero .lede{color:var(--muted);max-width:52ch;font-size:17px}
.hero .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.cmyk{display:inline-flex;gap:5px;align-items:center}.cmyk i{width:11px;height:11px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.15)}

/* sections */
section.s{padding-top:72px}
h2.page{font-family:var(--font-display);font-size:clamp(44px,7vw,64px);line-height:.95;font-weight:400}
.sub{color:var(--muted);max-width:62ch;margin-top:8px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:26px;counter-reset:st}
.step{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 14px 14px;font-size:14px;color:var(--muted);min-width:0}
.step b{display:block;color:var(--fg);font-size:15px;margin-bottom:3px}
.step:before{counter-increment:st;content:counter(st);position:absolute;top:-12px;left:14px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:12px;font-weight:600}
.step:not(:last-child):after{content:"\2192";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:16px}
@media(max-width:900px){.steps{grid-template-columns:1fr;gap:24px}.step:not(:last-child):after{content:"\2193";right:auto;left:50%;top:auto;bottom:-22px;transform:translateX(-50%)}}

/* kiss-cut sheet */
.sheet{position:relative;border:2px dashed var(--accent);border-radius:26px;padding:34px 22px 24px;margin-top:26px;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.sheet>.tag{position:absolute;top:-11px;left:22px;background:var(--bg);padding:0 10px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;gap:10px;align-items:center}
.sheet>.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* peel cards */
.peels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media(max-width:860px){.peels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.peel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 10px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.peel:hover:not([disabled]){transform:translateY(-3px) rotate(-1deg);box-shadow:0 8px 18px rgba(192,36,58,.12)}
.peel[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.peel b{font-size:15px}.peel small{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.peel.locked{opacity:.78}.peel.locked small{color:var(--muted)}
.stk{width:68px;height:68px;filter:var(--stk)}
.stk svg{width:100%;height:100%;display:block}

/* channel detail */
.chan{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 24px;align-items:start;margin-top:18px;animation:rise .45s ease both}
.chan .stk{width:96px;height:96px}
@media(max-width:560px){.chan{grid-template-columns:1fr}}
.chan h3{font-size:26px;font-weight:600;line-height:1.15;margin:4px 0 8px}
.chan .job{color:var(--muted);margin-bottom:14px;max-width:60ch}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--font-mono);color:var(--muted);font-weight:500;margin-bottom:8px}
.ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:5px}.ul li::marker{color:var(--accent)}
.think{background:var(--accent-soft);border-radius:14px;padding:16px 18px}
.think h4{color:var(--accent)}.think p{font-size:18px;font-weight:500;line-height:1.35}
.callout{display:flex;gap:12px;background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin-top:18px}
.callout svg{flex:none;width:20px;height:20px;fill:var(--accent);margin-top:3px}
.note{color:var(--muted);font-size:13px}

/* locked tiles + gate */
.lockgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
@media(max-width:700px){.lockgrid{grid-template-columns:1fr}}
.lock{position:relative;border:1px dashed var(--line);border-radius:14px;padding:16px;background:var(--surface);overflow:hidden}
.lock b{display:block;font-size:15px}.lock span{font-size:13px;color:var(--muted)}
.lock:after{content:"unlock to peel";position:absolute;right:10px;top:10px;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.gate{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:center}
@media(max-width:760px){.gate{grid-template-columns:1fr}}
.gate h3{font-family:var(--font-display);font-size:clamp(40px,6vw,56px);font-weight:400;line-height:.95;margin-bottom:10px}
form.f{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.f label.l{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
.f input[type=text],.f input[type=email],.f textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.f .consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.f .consent input{margin-top:3px;accent-color:var(--accent)}
.err{color:var(--accent);font-size:13px;min-height:18px}
.bi-d{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:500;margin-top:6px}.bi-d input{accent-color:var(--accent);width:18px;height:18px}.pbar{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:8px}.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ok{background:var(--sage-bg);color:var(--sage-fg);border-radius:14px;padding:16px 18px}

/* guide */
#guide{display:none}body.unlocked #guide{display:block}body.unlocked .locked-only{display:none}body:not(.unlocked) .unlocked-only{display:none}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:22px;scrollbar-width:none;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));background:var(--bg);z-index:20}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;padding:12px 14px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.panel{padding-top:28px;display:flex;flex-direction:column;gap:26px;animation:rise .45s ease both}.panel[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.block{display:flex;flex-direction:column;gap:12px;min-width:0}
.block>h3{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.db-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.db{width:100%;border-collapse:collapse;min-width:520px}
.db th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.db td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}.db tr:last-child td{border-bottom:0}.db td.k{font-weight:600}
details.tog{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.tog>summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;gap:12px;align-items:center}
details.tog>summary::-webkit-details-marker{display:none}
details.tog>summary:before{content:"";width:8px;height:8px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .2s}
details.tog[open]>summary:before{transform:rotate(45deg)}
.togbody{padding:2px 16px 16px;display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--font-display);font-size:50px;line-height:.85;font-weight:400;color:var(--accent)}.kpi span{font-size:13px;color:var(--muted)}
.bi-tree{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bi-n{border-radius:18px;padding:12px 18px;text-align:center;font-weight:600;min-width:0}.bi-n small{display:block;font-weight:400;font-size:12px;margin-top:2px;opacity:.8}
.bi-n.l1{background:var(--accent-soft);border:1px solid var(--accent);min-width:min(260px,100%)}.bi-n.l2{background:var(--rose-bg);color:var(--rose-fg);min-width:min(180px,100%)}
.bi-down,.bi-mid{color:var(--accent);font-size:20px;line-height:1;text-align:center}
.bi-top{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.bi-cols{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px 14px;align-items:start;width:100%;max-width:760px}
.bi-col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}.bi-mid{margin-top:22px}
.bi-kids{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.bi-kids span{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:600;font-size:13px}
@media(max-width:560px){.bi-cols{grid-template-columns:1fr 1fr}.bi-mid{display:none}.bi-n{padding:10px}}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:13px;font-weight:500}.node.hot{background:var(--accent-soft);border-color:var(--accent)}.arr{color:var(--accent);font-weight:600}
.board{position:relative;height:340px;border:2px dashed var(--line);border-radius:20px;background:repeating-linear-gradient(0deg,transparent 0 31px,color-mix(in srgb,var(--line) 55%,transparent) 31px 32px),repeating-linear-gradient(90deg,transparent 0 31px,color-mix(in srgb,var(--line) 55%,transparent) 31px 32px);overflow:hidden;touch-action:pan-y}
.board .sk{position:absolute;width:84px;height:84px;filter:var(--stk);cursor:grab;touch-action:none;transition:left .5s cubic-bezier(.3,1.4,.5,1),top .5s cubic-bezier(.3,1.4,.5,1);user-select:none}
.board .sk.drag{cursor:grabbing;transition:none;z-index:5}
.board .sk svg{width:100%;height:100%;pointer-events:none}
.boardbar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.seg{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.ci{display:flex;flex-direction:column;gap:10px}
.cirow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cirow .nm{display:flex;gap:12px;align-items:center}.cirow .stk{width:44px;height:44px;flex:none}.cirow .nm small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
@media(max-width:640px){.cirow{grid-template-columns:1fr}}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media(max-width:760px){.res{grid-template-columns:1fr}}
.res .card.w{background:var(--sage-bg);border-color:transparent;color:var(--sage-fg)}.res .card.d{background:var(--sun-bg);border-color:transparent;color:var(--sun-fg)}.res .card.o{background:var(--rose-bg);border-color:transparent;color:var(--rose-fg)}
.res .card h4{color:inherit;opacity:.8}
.svc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:700px){.svc{grid-template-columns:1fr}}
.svc .card b{font-size:17px;display:block;margin-bottom:4px}
.snap{background:var(--poster);border:2px dashed var(--accent);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px;color:#3B2A30}
.snap .price{font-family:var(--font-display);font-size:64px;line-height:.85;color:#A71D31}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .snap{background:#3a2430;color:var(--fg)}}
.copybox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.copybox .txt{white-space:pre-line;overflow-wrap:anywhere}
.copybox .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.swatches{display:flex;flex-wrap:wrap;gap:10px}.swatches div{display:flex;gap:8px;align-items:center;font-size:13px}.swatches i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:block}
footer.fin{margin-top:80px;padding-top:26px;border-top:1px dashed var(--accent);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}

/* ===== sticker-sheet + loud studio layer ===== */
main{overflow-x:clip}
.hero{position:relative;isolation:isolate}
.blob{position:absolute;z-index:-1;pointer-events:none}
.b1{width:340px;height:300px;left:-90px;top:10px;background:var(--sage-bg);border-radius:63% 37% 54% 46%/55% 48% 52% 45%;transform:rotate(-12deg)}
.b2{width:260px;height:240px;right:-40px;top:-10px;background:var(--sun-bg);border-radius:41% 59% 38% 62%/57% 40% 60% 43%;transform:rotate(18deg)}
.b3{width:220px;height:200px;right:12%;bottom:-30px;background:var(--rose-bg);border-radius:55% 45% 62% 38%/42% 58% 42% 58%;transform:rotate(-8deg)}
.pwrap{position:relative;width:100%;max-width:400px;justify-self:center}
.pwrap .poster{transform:rotate(-2.2deg);box-shadow:0 0 0 7px #fff,0 16px 34px rgba(59,42,48,.24);max-width:none;max-height:none;border-color:transparent}
@media(max-width:860px){.pwrap{max-width:290px}}
.hs{position:absolute;width:84px;height:84px;filter:var(--stk);animation:bob 5.5s ease-in-out infinite;z-index:3;pointer-events:none}
.hs svg,.sk svg{width:100%;height:100%;display:block}
.hs1{right:-30px;top:7%;--r:14deg}.hs2{left:-34px;bottom:13%;--r:-10deg;width:100px;height:100px;animation-delay:-2s}.hs3{right:-20px;bottom:5%;--r:8deg;width:66px;height:66px;animation-delay:-3.5s}.hs4{left:-14px;top:28%;--r:-6deg;width:58px;height:58px;animation-delay:-1s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-9px) rotate(calc(var(--r,0deg) + 5deg))}}
.hero h1 mark{background:linear-gradient(transparent 58%,var(--butter) 58% 92%,transparent 92%);color:inherit;padding:0 .12em;margin:0 -.12em;display:inline-block;transform:rotate(-1.2deg)}
.hero .lede{max-width:50ch}
.wet{filter:url(#wet)}
.marq2{margin:64px calc(50% - 50vw) 0;overflow:hidden;background:var(--sage-bg);color:var(--sage-fg);border-block:2px solid var(--ink);white-space:nowrap;transform:rotate(-1.2deg)}
.marq2 div{display:inline-block;padding:6px 0;font-family:var(--font-display);font-size:clamp(34px,5vw,56px);line-height:1.1;animation:marq 46s linear infinite reverse}
.ruler{display:flex;overflow:hidden;font-family:var(--font-mono);font-size:9px;color:var(--muted);border-bottom:1px solid var(--line);margin:-12px -2px 16px;white-space:nowrap;user-select:none}
.ruler span{flex:0 0 28px;border-left:1px solid var(--line);padding-left:3px;height:15px;line-height:15px}
.rl{display:inline-flex;overflow:hidden;height:1.28em;line-height:1.28;vertical-align:bottom}
.rl i{font-style:normal;display:inline-block;position:relative;white-space:pre;transition:transform .4s cubic-bezier(.7,0,.2,1);transition-delay:calc(var(--i)*16ms)}
.rl i::after{content:attr(data-l);position:absolute;left:0;top:100%}
a:hover .rl i,a:focus-visible .rl i,button:hover .rl i{transform:translateY(-100%)}
.top nav a{font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.logo{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:2px 10px}.logo img{height:38px;width:auto;display:block}@media(max-width:520px){.logo img{height:32px}}
.peel{overflow:hidden}
.peel::after{content:"";position:absolute;right:0;bottom:0;width:22px;height:22px;background:linear-gradient(135deg,var(--bg) 50%,var(--accent-soft) 50%);border-top-left-radius:10px;box-shadow:-2px -2px 5px rgba(59,42,48,.12);transition:width .25s,height .25s}
.peel:hover:not(.locked)::after,.peel[aria-pressed="true"]::after{width:38px;height:38px}
/* index list */
.index{list-style:none;margin:26px 0 0;padding:0;border-bottom:2px solid var(--ink)}
.ix a{position:relative;display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,260px) 90px;gap:10px 20px;align-items:center;padding:12px 8px;border-top:2px solid var(--ink);text-decoration:none;color:var(--fg);transition:background .2s,padding .25s}
.ix .no{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.ix .nm{font-family:var(--font-display);font-size:clamp(46px,8vw,92px);line-height:.9;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.ix .jb{font-size:14px;color:var(--muted)}
.ix .stk{width:72px;height:72px;opacity:0;transform:scale(.4) rotate(-25deg);transition:opacity .2s,transform .35s cubic-bezier(.3,1.6,.5,1);justify-self:end}
.ix a:hover,.ix a:focus-visible{background:var(--accent-soft);padding-left:20px}
.ix a:hover .nm,.ix a:focus-visible .nm{transform:translateX(10px) rotate(-1.5deg)}
.ix a:hover .stk,.ix a:focus-visible .stk{opacity:1;transform:scale(1) rotate(8deg)}
@media(max-width:700px){.ix a{grid-template-columns:44px minmax(0,1fr) 64px}.ix .jb{grid-column:2}.ix .stk{opacity:1;transform:none;width:56px;height:56px;grid-row:1/3;grid-column:3}}
.rv{opacity:0;transform:translateY(22px) rotate(-.8deg)}
.rv.in{opacity:1;transform:none;transition:opacity .6s ease,transform .7s cubic-bezier(.2,.9,.3,1.2)}
.mega2{font-family:var(--font-display);font-size:clamp(54px,11vw,150px);line-height:.88;text-align:center;color:var(--butter);-webkit-text-stroke:.012em var(--ink);paint-order:stroke fill;transform:rotate(-1.6deg);margin:70px 0 10px;filter:url(#wet);text-shadow:4px 5px 0 var(--ink)}
.board .sk{width:88px;height:88px}

/* ===== four opportunities ===== */
.opp-map{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 12px;overflow-x:auto}
.opp-map svg{display:block;width:100%;height:auto;min-width:600px}
.opp-map text{font-family:var(--font-body)}
.opp-map .t{font-size:13px;font-weight:600;fill:var(--fg)}
.opp-map .s{font-size:11px;fill:var(--muted)}
.opp-map .m{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;fill:var(--accent)}
.opp-map .box{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.opp-map .hot{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.opp-map .sage{fill:var(--sage-bg);stroke:none}
.opp-map .sun{fill:var(--sun-bg);stroke:none}
.opp-map .rose{fill:var(--rose-bg);stroke:none}
.opp-map .peach{fill:var(--peach-bg);stroke:none}
.opp-map .lilac{fill:var(--lilac-bg);stroke:none}
.opp-map .ghost{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 5}
.opp-map .ln{stroke:var(--accent);stroke-width:2;fill:none}
.opp-map .dash{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 5;fill:none}
.opp4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:860px){.opp4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.opp4{grid-template-columns:1fr}}
.opp4 .card{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.opp4 .stk{width:58px;height:58px}
.opp4 .card b{font-size:16px}.opp4 .card span{font-size:13.5px;color:var(--muted)}
.opp-sec{display:flex;flex-direction:column;gap:16px;padding-top:30px;border-top:2px dashed var(--line);min-width:0}
.opp-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.opp-no{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--font-mono);font-size:13px}
.opp-head h3{font-family:var(--font-display);font-weight:400;font-size:clamp(40px,6vw,58px);line-height:.95;margin:0;flex-basis:100%}
.opp-sec p{max-width:66ch}

.ns{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.ns .row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}
.ns .row .tag{display:inline-block;font:500 11px var(--font-mono,'DM Mono',monospace);text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:99px;margin-right:8px}
.ns .row.w .tag{background:var(--sage-bg);color:var(--sage-fg)}
.ns .row.d .tag{background:var(--sun-bg);color:var(--sun-fg)}
.ns .row.o .tag{background:var(--rose-bg);color:var(--rose-fg)}
.ns .row p{margin:6px 0 8px}
.ns .row a.svl{font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.ns-focus{margin-top:14px;display:flex;flex-direction:column;gap:12px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

body.gate-on{min-height:100vh}
.lg{min-height:calc(100vh - 34px);display:grid;place-items:center;padding:28px 18px calc(28px + env(safe-area-inset-bottom,0px));position:relative;overflow:hidden}
.lg:before,.lg:after{content:"";position:absolute;border-radius:50%;filter:blur(64px);z-index:0;pointer-events:none}
.lg:before{width:380px;height:380px;background:var(--accent-soft);left:-120px;top:-60px;opacity:.8}
.lg:after{width:320px;height:320px;background:var(--sun-bg);right:-100px;bottom:-50px;opacity:.7}
.lg-card{position:relative;z-index:1;width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:30px 26px 24px;box-shadow:0 18px 50px -24px rgba(59,42,48,.35)}
.lg-card:before{content:"";position:absolute;inset:8px;border:1.5px dashed var(--line);border-radius:19px;pointer-events:none}
.lg-card>*{position:relative}
.lg-logo{height:38px;width:auto;display:block;margin:0 auto 16px}
.lg-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lg-card h1{font-family:var(--font-display);font-weight:400;font-size:clamp(56px,15vw,76px);line-height:.86;text-align:center;margin:10px 0 12px}
.lg-card h1 mark{background:linear-gradient(transparent 58%,var(--accent-soft) 58%);color:inherit;padding:0 4px}
.lg-sub{text-align:center;color:var(--muted);font-size:14.5px;margin-bottom:20px}
.lg-step{display:flex;flex-direction:column;gap:12px;animation:rise .4s ease both}.lg-step[hidden]{display:none}
.lg-step label{font-size:12px;color:var(--muted);font-weight:500}
.lg-in{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.lg-pw{position:relative}.lg-pw .lg-in{padding-right:66px}
.lg-pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:6px 8px;border-radius:8px}
.lg-who{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 14px;font-size:13px}
.lg-who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-who button{flex:none;border:0;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--accent)}
.lg .btn{justify-content:center;width:100%;padding:13px 20px;font-size:15px}.lg .btn:disabled{opacity:.7;cursor:wait}
.lg-keep{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}.lg-keep input{accent-color:var(--accent);width:16px;height:16px}
.lg-err{color:var(--accent);font-size:13px;min-height:18px;text-align:center;margin-top:8px}
.lg-foot{margin-top:12px;text-align:center;font-size:13px;color:var(--muted)}
.lg-shake{animation:lgshake .35s}@keyframes lgshake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lg-open{display:none;text-align:center;color:var(--muted);padding:40px 0}.lg.busy .lg-open{display:block}.lg.busy .lg-main{display:none}
</style>
</head>
